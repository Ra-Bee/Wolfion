name: Build Wolfion Android AAB

# Builds a signed Android App Bundle (.aab) for the Wolfion app in the cloud,
# so no local Android Studio / JDK / Gradle install is needed.
#
# Trigger it manually from the GitHub "Actions" tab (Run workflow). When it
# finishes, download the "wolfion-release-aab" artifact and upload that .aab to
# the Google Play Console.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64  - your upload keystore, base64-encoded
#   ANDROID_STORE_PASSWORD   - keystore password
#   ANDROID_KEY_ALIAS        - key alias inside the keystore (e.g. wolfion-upload)
#   ANDROID_KEY_PASSWORD     - password for that alias
#   VITE_CLERK_PUBLISHABLE_KEY - Clerk publishable key (pk_...) baked into the web build
#   VITE_FIREBASE_API_KEY      - Firebase web API key baked into the web build
#   VITE_CLERK_PROXY_URL       - optional; leave unset if you don't use a Clerk proxy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web bundle
        working-directory: artifacts/wolfion
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CLERK_PROXY_URL: ${{ secrets.VITE_CLERK_PROXY_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: pnpm run build

      - name: Sync Capacitor Android project
        run: pnpm --filter @workspace/wolfion exec cap sync android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wolfion-upload.keystore"

      - name: Build signed release bundle
        working-directory: artifacts/wolfion/android
        env:
          ANDROID_STORE_FILE: ${{ runner.temp }}/wolfion-upload.keystore
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: wolfion-release-aab
          path: artifacts/wolfion/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wolfion-release-apk
          path: artifacts/wolfion/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
